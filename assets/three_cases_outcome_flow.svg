<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600">
  <defs>
    <style>
      .bg{fill:#FAFAFA}.dark .bg{fill:#101018}
      .title{fill:#1A1A2E}.dark .title{fill:#E8E8F0}
      .sub{fill:#555}.dark .sub{fill:#9A9AB0}
      .card-a{fill:#EAF2FD}.dark .card-a{fill:#12233D}
      .ok{fill:#E7F6EC}.dark .ok{fill:#16301F}
      .warn{fill:#FDF6E3}.dark .warn{fill:#332A10}
      .ok-stroke{stroke:#2E9E5B}.dark .ok-stroke{stroke:#4ECB83}
      .warn-stroke{stroke:#B8860B}.dark .warn-stroke{stroke:#E0B44F}
      .bad{fill:#FBE9E9}.dark .bad{fill:#331212}
      .bad-stroke{stroke:#C0392B}.dark .bad-stroke{stroke:#E56B55}
      .stroke-a{stroke:#2E5FA3}.dark .stroke-a{stroke:#5B8DD9}
      text{font-family:"Segoe UI",Arial,sans-serif}
    </style>
  </defs>
  <rect width="980" height="600" class="bg"/>
  <text x="490" y="40" font-size="22" font-weight="bold" text-anchor="middle" class="title">Four Cases — Outcome / Reason / Relying-Party Action</text>
  <text x="490" y="64" font-size="13.5" text-anchor="middle" class="sub">Evidence quality and authorization validity separated; former Case B split into B1/B2 per themes#42 review</text>
  <text x="175" y="110" font-size="14" font-weight="bold" text-anchor="middle" class="title">Case A</text>
  <text x="515" y="110" font-size="14" font-weight="bold" text-anchor="middle" class="title">Case B1</text>
  <text x="845" y="110" font-size="14" font-weight="bold" text-anchor="middle" class="title">Case C</text>
  <rect x="25" y="128" width="300" height="40" rx="9" class="card-a stroke-a"/><text x="39" y="147" font-size="11" font-weight="bold" fill="#2E5FA3">INPUT</text><text x="39" y="163" font-size="13.5" class="title">Valid registered credential</text><text x="39" y="181" font-size="11" class="sub">issued by authorized registrar; status current</text><rect x="25" y="174" width="300" height="40" rx="9" class="ok ok-stroke"/><text x="39" y="193" font-size="11" font-weight="bold" fill="#2E9E5B">OUTCOME</text><text x="39" y="209" font-size="13.5" class="title">positive</text><rect x="25" y="220" width="300" height="40" rx="9" class="warn warn-stroke"/><text x="39" y="239" font-size="11" font-weight="bold" fill="#B8860B">REASON</text><text x="39" y="255" font-size="13.5" class="title">none</text><rect x="25" y="266" width="300" height="40" rx="9" class="card-a stroke-a"/><text x="39" y="285" font-size="11" font-weight="bold" fill="#6A4FA3">ACTION</text><text x="39" y="301" font-size="13.5" class="title">proceed per normal policy</text>
  <rect x="345" y="128" width="300" height="40" rx="9" class="card-a stroke-a"/><text x="359" y="147" font-size="11" font-weight="bold" fill="#2E5FA3">INPUT</text><text x="359" y="163" font-size="13.5" class="title">Unverifiable issuer scope</text><text x="359" y="181" font-size="11" class="sub">signature valid; authoritative scope info unavailable</text><rect x="345" y="174" width="300" height="40" rx="9" class="ok ok-stroke"/><text x="359" y="193" font-size="11" font-weight="bold" fill="#2E9E5B">OUTCOME</text><text x="359" y="209" font-size="13.5" class="title">indeterminate</text><rect x="345" y="220" width="300" height="40" rx="9" class="warn warn-stroke"/><text x="359" y="239" font-size="11" font-weight="bold" fill="#B8860B">REASON</text><text x="359" y="255" font-size="13.5" class="title">authorization unresolved</text><rect x="345" y="266" width="300" height="40" rx="9" class="card-a stroke-a"/><text x="359" y="285" font-size="11" font-weight="bold" fill="#6A4FA3">ACTION</text><text x="359" y="301" font-size="13.5" class="title">missing evidence ≠ invalid; deny-open or manual review</text>
  <text x="515" y="340" font-size="14" font-weight="bold" text-anchor="middle" class="title">Case B2</text>
  <rect x="345" y="356" width="300" height="40" rx="9" class="card-a stroke-a"/><text x="359" y="375" font-size="11" font-weight="bold" fill="#2E5FA3">INPUT</text><text x="359" y="391" font-size="13.5" class="title">Confirmed out-of-scope issuer</text><text x="359" y="409" font-size="11" class="sub">signature valid; scope registry confirms lack of scope</text><rect x="345" y="402" width="300" height="40" rx="9" class="bad bad-stroke"/><text x="359" y="421" font-size="11" font-weight="bold" fill="#C0392B">OUTCOME</text><text x="359" y="437" font-size="13.5" class="title">rejected</text><rect x="345" y="448" width="300" height="40" rx="9" class="bad bad-stroke"/><text x="359" y="467" font-size="11" font-weight="bold" fill="#C0392B">REASON</text><text x="359" y="483" font-size="13.5" class="title">authorization rejected</text><rect x="345" y="494" width="300" height="40" rx="9" class="card-a stroke-a"/><text x="359" y="513" font-size="11" font-weight="bold" fill="#6A4FA3">ACTION</text><text x="359" y="529" font-size="13.5" class="title">do not accept; treat as unauthorized</text>
  <rect x="665" y="128" width="300" height="40" rx="9" class="card-a stroke-a"/><text x="679" y="147" font-size="11" font-weight="bold" fill="#2E5FA3">INPUT</text><text x="679" y="163" font-size="13.5" class="title">Status source unavailable</text><text x="679" y="181" font-size="11" class="sub">status endpoint unreachable at verification time</text><rect x="665" y="174" width="300" height="40" rx="9" class="ok ok-stroke"/><text x="679" y="193" font-size="11" font-weight="bold" fill="#2E9E5B">OUTCOME</text><text x="679" y="209" font-size="13.5" class="title">indeterminate</text><rect x="665" y="220" width="300" height="40" rx="9" class="warn warn-stroke"/><text x="679" y="239" font-size="11" font-weight="bold" fill="#B8860B">REASON</text><text x="679" y="255" font-size="13.5" class="title">status unavailable ≠ revoked</text><rect x="665" y="266" width="300" height="40" rx="9" class="card-a stroke-a"/><text x="679" y="285" font-size="11" font-weight="bold" fill="#6A4FA3">ACTION</text><text x="679" y="301" font-size="13.5" class="title">do not treat as revoked or valid; escalate</text>
  <text x="490" y="580" font-size="12" text-anchor="middle" class="sub">Machine-readable conclusions (payload digests) are published for reproduction alongside this diagram.</text>
</svg>