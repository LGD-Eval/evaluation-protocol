# Funding / 资助

> LGD-Eval · 凡自治之物评测线 ｜ 支持独立评测基础设施的持续建设。

## 资助方式 / Ways to fund

- **GitHub Sponsors**：赞助本账号/组织（即将开启）
- **企业评测认证**：企业级评测服务（Phase 3）收入回流生态
- **早期贡献者**：资金以外的参与同样重要——代码、协议、翻译、评测、推广（见 CONTRIBUTORS.md）

## 资助用途 / How funds are used

1. 基础设施：CI、存证上链、扫描器算力
2. 贡献者激励：认证徽章、大使计划、开源奖
3. 全球参与：多语言翻译、时区大使、生态平台收录

## Transparency / 透明度

资助去向按季度公开（evaluation-evidence 存证），接受独立复核。

