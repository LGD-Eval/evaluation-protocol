# ============================================================
# PR REVIEW BOT — 审核机器人（LGD-Eval）
# Automatic review on every pull request:
#   mojibake scan · key-file completeness · size limits ·
#   bilingual-terminology check · link check · structured comment
# 每个 PR 自动审核：乱码检测·关键文件完整性·规模限制·双语术语·链接检查·结构化评论
# ============================================================
name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit the PR (mojibake / completeness / size / terms / links)
        id: audit
        run: python3 <<'PY'
import os, re, sys, json, subprocess

def subprocess_check(args):
    r = subprocess.run(args, capture_output=True, text=True)
    if r.returncode != 0:
        raise RuntimeError(r.stderr[:200])
    return r.stdout.splitlines()

base = os.environ.get("GITHUB_BASE_REF", "main") or "main"
head = os.environ.get("GITHUB_SHA", "HEAD") or "HEAD"

issues = []
errors = []

try:
    changed = subprocess_check(["git", "diff", "--name-only", f"origin/{base}...{head}"])
except Exception as e:
    changed = ["(diff unavailable: %s)" % e]
changed = [c for c in changed if c.strip()]
changed_md = [c for c in changed if c.lower().endswith((".md", ".txt", ".cff", ".jsonld", ".yml", ".yaml"))]
issues.append("Changed files (%d): %s" % (len(changed), ", ".join(changed[:20]) or "none"))

BAD = re.compile(r"\?\?\?\?\?|\ufffd|锟斤拷")
for f in changed_md:
    try:
        with open(f, "r", encoding="utf-8", errors="strict") as fh:
            content = fh.read()
        for i, line in enumerate(content.splitlines(), 1):
            if BAD.search(line):
                errors.append("Mojibake/乱码: %s:%d -> %s" % (f, i, line.strip()[:80]))
    except UnicodeDecodeError:
        errors.append("Encoding/编码: %s is not valid UTF-8" % f)

KEYFILES = ["README.md", "AGENTS.md", "LICENSE", "SECURITY.md"]
for k in KEYFILES:
    if not os.path.exists(k):
        issues.append("Missing key file/关键文件缺失: %s" % k)

if len(changed) > 50:
    issues.append("Large PR/超大 PR: %d files — split into focused PRs" % len(changed))

TERMS = ["LGD", "自治之物", "有籍", "有证", "有门禁", "Governance", "Registry", "Evidence", "Gates"]
for f in changed_md:
    if not f.lower().endswith(".md"):
        continue
    try:
        with open(f, "r", encoding="utf-8") as fh:
            c = fh.read()
    except Exception:
        continue
    for t in TERMS:
        if t in c and re.match(r"[\u4e00-\u9fff]", t):
            pos = c.find(t)
            ctx = c[max(0, pos - 200):pos + 200]
            if not re.search(r"[A-Za-z]{4,}", ctx):
                issues.append("Term/术语: '%s' in %s without nearby English counterpart (bilingual rule)" % (t, f))

for f in changed_md:
    if "README" not in f.upper():
        continue
    try:
        with open(f, "r", encoding="utf-8") as fh:
            c = fh.read()
    except Exception:
        continue
    if "github.com/LGD-Eval" not in c and os.environ.get("EXPECT_LINKS", "1") == "1":
        issues.append("README %s has no LGD-Eval cross-repo links (anchor discipline/内锚)" % f)

result = {
    "errors": errors[:30],
    "issues": issues[:40],
    "changed_count": len(changed),
}
with open(os.environ.get("GITHUB_OUTPUT", "out.txt"), "a") as fh:
    fh.write("result=%s\n" % json.dumps(result))
with open(os.environ.get("GITHUB_STEP_SUMMARY", "summary.md"), "a") as fh:
    fh.write("## PR Review Bot — %s\n" % os.environ.get("GITHUB_REPOSITORY", ""))
    fh.write("- Errors/阻断: %d | Warnings/提示: %d | Changed/变更: %d\n" % (len(errors), len(issues), len(changed)))
    for e in errors[:15]:
        fh.write("- :red_circle: %s\n" % e)
    for i in issues[:20]:
        fh.write("- :yellow_circle: %s\n" % i)

sys.exit(1 if errors else 0)
PY
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_OUTPUT: /tmp/audit_out.txt

      - name: Post structured review comment
        if: always()
        env:
          AUDIT_JSON: ${{ steps.audit.outputs.result }}
        uses: actions/github-script@v7
        with:
          script: |
            let data = { errors: [], issues: [] };
            try { data = JSON.parse(process.env.AUDIT_JSON || '{}'); } catch (e) {}
            const body = [
              "## 🤖 LGD-Eval PR Review Bot",
              "",
              "**Blocking issues/阻断**: " + (data.errors || []).length + " — **Warnings/提示**: " + (data.issues || []).length,
              "",
              ...(data.errors || []).map(e => "- 🔴 " + e),
              ...(data.issues || []).map(i => "- 🟡 " + i),
              "",
              "> 审核机器人结论：乱码/编码类错误必须修复；提示类仅供人类评审参考。签发权始终在人。",
              "> Bot verdict: mojibake/encoding failures must be fixed; warnings are for human reviewers. Sign-off always stays with humans (签发权在人)。"
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
