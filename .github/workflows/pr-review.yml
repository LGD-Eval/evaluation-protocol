# ============================================================
# PR REVIEW BOT — 审核机器人（LGD-Eval）
# Automatic review on every pull request:
#   mojibake scan · key-file completeness · size limits ·
#   bilingual-terminology check · link check · structured comment
# 每个 PR 自动审核：乱码检测·关键文件完整性·规模限制·双语术语·链接检查·结构化评论
# ============================================================
name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit the PR (mojibake / completeness / size / terms / links)
        id: audit
        run: python3 .github/scripts/pr-audit.py
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_OUTPUT: /tmp/audit_out.txt

      - name: Post structured review comment
        if: always()
        env:
          AUDIT_JSON: ${{ steps.audit.outputs.result }}
        uses: actions/github-script@v7
        with:
          script: |
            let data = { errors: [], issues: [] };
            try { data = JSON.parse(process.env.AUDIT_JSON || '{}'); } catch (e) {}
            const body = [
              "## 🤖 LGD-Eval PR Review Bot",
              "",
              "**Blocking issues/阻断**: " + (data.errors || []).length + " — **Warnings/提示**: " + (data.issues || []).length,
              "",
              ...(data.errors || []).map(e => "- 🔴 " + e),
              ...(data.issues || []).map(i => "- 🟡 " + i),
              "",
              "> 审核机器人结论：乱码/编码类错误必须修复；提示类仅供人类评审参考。签发权始终在人。",
              "> Bot verdict: mojibake/encoding failures must be fixed; warnings are for human reviewers. Sign-off always stays with humans (签发权在人)。"
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
