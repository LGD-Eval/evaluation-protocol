# ============================================================
# AI WELCOME BOT — AI 欢迎接待（LGD-Eval）
# Welcomes first-time contributors on their first issue/PR,
# with routing guidance (bilingual). Governed by AI-PASSPORT (AI-BOT-003).
# workflow_dispatch: self-test mode — verify welcome logic & key files.
# 首次互动自动欢迎 + 参与路径引导（双语）；手动触发可自检。
# ============================================================
name: AI Welcome Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      self_test:
        description: "Run self-test of welcome logic (no event needed) / 自检欢迎逻辑"
        required: false
        default: "true"
      test_login:
        description: "Login to simulate (self-test only) / 自检用测试登录名"
        required: false
        default: "tester-ai"

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' && (github.event.issue.author_association == 'FIRST_TIME_CONTRIBUTOR' || github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR') }}
    steps:
      - name: Post bilingual welcome & routing
        uses: actions/github-script@v9
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const num = isIssue ? context.payload.issue.number : context.payload.pull_request.number;
            const login = isIssue ? context.payload.issue.user.login : context.payload.pull_request.user.login;
            const repo = context.repo;
            const base = `https://github.com/${repo.owner}/${repo.repo}`;
            const body = [
              `## 👋 Welcome, @${login}! / 欢迎你！`,
              '',
              'Thanks for your first interaction with LGD-Eval. Here is how to proceed / 感谢你与 LGD-Eval 的首次互动，参与路径如下：',
              '',
              `- **Explore** / 了解我们: [README](${base}/blob/main/README.md) — who we are, neutrality, capabilities`,
              `- **Contribute** / 参与（含零门槛路径，不会编程也能参与）: [CONTRIBUTORS.md](${base}/blob/main/CONTRIBUTORS.md)`,
              `- **Onboard your AI** / 引导你的 AI 参与: [AI-VOICE-AMBASSADORS.md](${base}/blob/main/AI-VOICE-AMBASSADORS.md)（登记即获 VC +1）`,
              `- **Good first issues** / 新手任务: filter by the \\`good first issue\\` label`,
              '',
              '> AI-assisted welcome by LGD-Eval AI（AI-BOT-003, passport L3）· 由 LGD-Eval AI 自动欢迎 · 受 AI 护照制度治理',
              '> Maintainers aim to respond within 72h / 维护者将于 72 小时内响应。'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: num,
              body: body
            });

  self-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run welcome self-test
        env:
          TEST_LOGIN: ${{ github.event.inputs.test_login }}
        run: python3 .github/scripts/welcome-self-test.py
